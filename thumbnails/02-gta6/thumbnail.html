<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0b0b}
.bg{position:absolute;inset:-60px;background:url(poster.jpg) center/cover;filter:blur(18px) brightness(.22) saturate(.8)}
.print{position:absolute;border:11px solid #f4f1ea;box-shadow:0 18px 36px rgba(0,0,0,.75);background:#000;overflow:hidden}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 100%)}
.fig{position:absolute;left:50%;bottom:-75px;height:530px;transform:translateX(-50%);image-rendering:pixelated;
  filter:drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff) drop-shadow(0 0 40px rgba(255,74,18,.55)) drop-shadow(0 24px 40px rgba(0,0,0,.8))}
.t1{position:absolute;left:0;right:0;top:22px;text-align:center;font:84px 'Archivo Black';color:#fff;-webkit-text-stroke:9px #000;paint-order:stroke fill;text-shadow:0 8px 22px rgba(0,0,0,.9);letter-spacing:1px}
.t2{position:absolute;left:0;right:0;top:100px;text-align:center;font:200px 'Archivo Black';color:#FF4A12;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 14px 30px rgba(0,0,0,.9);letter-spacing:2px;line-height:1}
.label{position:absolute;font:italic 800 66px Archivo;color:#FFE600;-webkit-text-stroke:6px #000;paint-order:stroke fill;text-shadow:0 6px 16px rgba(0,0,0,.9)}
.grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay}
</style></head><body>
<div class="bg"></div>
<!-- evidence prints -->
<div class="print" style="left:28px;top:205px;width:250px;height:440px;transform:rotate(-7deg)"><img src="poster-left.jpg"></div>
<div class="print" style="left:205px;top:420px;width:330px;height:220px;transform:rotate(5deg)"><img src="roulette.jpg"></div>
<div class="print" style="left:985px;top:215px;width:250px;height:440px;transform:rotate(6deg)"><img src="poster-right.jpg"></div>
<div class="vig"></div>
<!-- title, then the hero in front of it -->
<div class="t1">DON'T PLAY</div>
<div class="t2">GTA VI</div>
<img class="fig" src="figure-cut.png">
<!-- annotation -->
<svg width="1280" height="720" style="position:absolute;inset:0">
  <defs><marker id="h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E31B1B" stroke="#000" stroke-width=".8"/></marker></defs>
  <path d="M1000,640 C985,560 940,520 880,505" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round"/>
  <path d="M1000,640 C985,560 940,520 880,505" fill="none" stroke="#E31B1B" stroke-width="16" stroke-linecap="round" marker-end="url(#h)"/>
</svg>
<div class="label" style="left:925px;top:625px">Censored</div>
<svg class="grain" width="1280" height="720"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1280" height="720" filter="url(#n)"/></svg>
</body></html>
