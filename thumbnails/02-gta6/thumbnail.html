<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2a0505}
/* one full-bleed image, graded serious: desaturated, red-tinted, crushed shadows */
.bg{position:absolute;inset:-20px;background:url(poster.jpg) 45% center/cover;filter:grayscale(.2) saturate(1.35) contrast(1.2) brightness(.7) blur(1.2px)}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,0,40,.35),rgba(60,0,30,.15) 45%,rgba(25,0,10,.8));mix-blend-mode:multiply}
.redglow{position:absolute;left:640px;top:380px;width:900px;height:900px;margin:-450px;border-radius:50%;background:radial-gradient(circle,rgba(255,40,40,.35),rgba(255,40,40,0) 60%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.7) 100%)}
/* the censored figure highlighted */
.ring{position:absolute;left:485px;top:95px;width:300px;height:395px;border:13px solid #FF2020;border-radius:50%;box-shadow:0 0 30px rgba(255,32,32,.9),inset 0 0 30px rgba(255,32,32,.5)}
/* warning tag */
.tag{position:absolute;left:40px;top:36px;display:flex;align-items:center;gap:14px;background:#FFD400;color:#111;font:900 40px Inter;padding:10px 24px;border-radius:10px;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.5)}
/* caption: serious white, red underline */
.cap{position:absolute;left:0;right:0;bottom:58px;text-align:center;white-space:nowrap;font:150px Anton;line-height:1;color:#fff;letter-spacing:2px;text-shadow:0 0 3px #000,0 10px 30px rgba(0,0,0,.95)}
.cap span{background:linear-gradient(180deg,#FFD36E 0%,#FF8A5B 35%,#FF4FA0 65%,#A64DFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 18px rgba(255,79,160,.55)) drop-shadow(0 8px 20px rgba(0,0,0,.9))}
.underline{position:absolute;left:170px;right:170px;bottom:40px;height:14px;background:#FF2020;box-shadow:0 0 18px rgba(255,32,32,.8)}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay}
</style></head><body>
<div class="bg"></div><div class="tint"></div><div class="redglow"></div><div class="vig"></div>
<div class="ring"></div>
<div style="position:absolute;right:44px;top:34px;transform:rotate(6deg);filter:drop-shadow(0 12px 22px rgba(0,0,0,.75))">
  <div style="width:176px;background:#fff;border:6px solid #000;border-radius:14px;overflow:hidden;text-align:center">
    <div style="background:#E31B1B;padding:6px 0 2px;font:122px Anton;line-height:1;color:#fff;letter-spacing:1px">18<span style="font-size:80px;vertical-align:top">+</span></div>
    <div style="font:900 22px Inter;color:#000;padding:6px 0 8px;letter-spacing:.5px">ADULT CONTENT</div>
  </div>
</div>
<svg width="1280" height="720" style="position:absolute;inset:0;overflow:visible">
  <defs><marker id="ah18" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFD400" stroke="#000" stroke-width="1"/></marker></defs>
  <path d="M1110,250 C1080,330 960,300 830,270" fill="none" stroke="#000" stroke-width="28" stroke-linecap="round"/>
  <path d="M1110,250 C1080,330 960,300 830,270" fill="none" stroke="#FFD400" stroke-width="16" stroke-linecap="round" marker-end="url(#ah18)"/>
</svg>
<div class="tag">⚠ MUSLIMS, WATCH THIS</div>
<div class="cap">DON'T PLAY <span>GTA VI</span></div>
<div class="underline"></div>
<svg class="grain" width="1280" height="720"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1280" height="720" filter="url(#n)"/></svg>
</body></html>
