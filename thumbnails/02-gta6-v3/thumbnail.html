<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.base{position:absolute;inset:0;background:url(base.png) center/cover;filter:blur(.6px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.8) 100%)}
.bar{position:absolute;left:0;right:0;top:205px;height:170px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.72) 25%,rgba(0,0,0,.72) 75%,rgba(0,0,0,0))}
.wasted{position:absolute;left:0;right:0;top:205px;text-align:center;font:150px 'Bowlby One';letter-spacing:4px;color:#D21E1E;-webkit-text-stroke:6px #000;paint-order:stroke fill;text-shadow:0 0 30px rgba(210,30,30,.55),0 10px 24px rgba(0,0,0,.9)}
.hud{position:absolute;right:40px;top:32px;text-align:right;font:900 34px Inter;color:#fff;text-shadow:0 0 3px #000,0 3px 8px #000}
.hud b{display:block;font-size:56px;color:#7CFF8A}
.sub{position:absolute;left:0;right:0;top:385px;text-align:center;font:900 46px Inter;color:#fff;letter-spacing:1px;text-shadow:0 0 3px #000,0 6px 16px #000}
.sub span{color:#FFD400}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay}
</style></head><body>
<div class="base"></div><div class="vig"></div>
<div style="position:absolute;left:292px;top:60px;padding:6px 14px;background:rgba(0,0,0,.55);border-radius:8px;font:900 34px Inter;color:#fff">GTA <span style="background:linear-gradient(180deg,#FFD36E,#FF6FA0 55%,#A64DFF);-webkit-background-clip:text;background-clip:text;color:transparent">VI</span></div>
<div class="hud">TOTAL PLAYTIME<b>412 HRS</b></div>
<div class="bar"></div>
<div class="wasted">WASTED</div>
<div class="sub">...and it's not just <span>your time</span></div>
<svg class="grain" width="1280" height="720"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1280" height="720" filter="url(#n)"/></svg>
</body></html>
