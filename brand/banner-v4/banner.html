<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;position:relative;overflow:hidden;background:#071a2b}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#06162a 0%,#0b2a45 38%,#1d4a63 58%,#c98a5a 82%,#f3c57e 100%)}
.glow{position:absolute;left:50%;top:78%;width:2200px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,214,140,.55),rgba(255,214,140,0) 60%)}
svg{position:absolute;inset:0}
.word{position:absolute;left:0;right:0;top:575px;text-align:center;font:700 210px Amiri;color:#F5D58A;line-height:1;text-shadow:0 0 40px rgba(245,213,138,.55),0 6px 0 #6b4a17}
.sub{position:absolute;left:0;right:0;top:845px;text-align:center;font:italic 500 58px 'Cormorant Garamond';color:#F7E7C2;letter-spacing:6px}
</style></head><body>
<div class="sky"></div><div class="glow"></div>
<svg width="2560" height="1440" viewBox="0 0 2560 1440" id="s"></svg>
<div class="word">اقْرَأْ</div>
<div class="sub">Read · Learn · Reflect</div>
<script>
let seed=3;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
let out='';
// --- 8-point star geometric lattice, fading toward the horizon ---
out+='<defs><pattern id="g" width="160" height="160" patternUnits="userSpaceOnUse"><g fill="none" stroke="#E9C77B" stroke-width="2.2" opacity=".55">'+
 '<path d="M80,20 L97,63 L140,80 L97,97 L80,140 L63,97 L20,80 L63,63 Z"/>'+
 '<rect x="45" y="45" width="70" height="70" transform="rotate(45 80 80)"/>'+
 '<rect x="45" y="45" width="70" height="70"/>'+
 '<path d="M0,0 L20,20 M160,0 L140,20 M0,160 L20,140 M160,160 L140,140"/></g></pattern>'+
 '<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".6" stop-color="#fff" stop-opacity=".25"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
 '<radialGradient id="halo"><stop offset="0" stop-color="#F7E3A8" stop-opacity=".35"/><stop offset="1" stop-color="#F7E3A8" stop-opacity="0"/></radialGradient><mask id="m"><rect width="2560" height="1440" fill="url(#fade)"/></mask></defs>';
out+='<rect width="2560" height="1440" fill="url(#g)" mask="url(#m)" opacity=".35"/>';
// --- stars ---
for(let i=0;i<220;i++){const x=rnd()*2560,y=rnd()*820,r=rnd()<.08?3.2:1+rnd()*1.6;out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFF6DD" opacity="${.35+rnd()*.6}"/>`}
for(let i=0;i<14;i++){const x=rnd()*2560,y=rnd()*600,s=8+rnd()*10;out+=`<path d="M${x},${y-s} Q${x+2},${y-2} ${x+s},${y} Q${x+2},${y+2} ${x},${y+s} Q${x-2},${y+2} ${x-s},${y} Q${x-2},${y-2} ${x},${y-s} Z" fill="#FFF3D0"/>`}
// --- crescent ---
out+='<g transform="translate(2050 250)"><circle r="160" fill="url(#halo)"/><path d="M30,-90 A95,95 0 1 0 30,90 A75,75 0 1 1 30,-90 Z" fill="#F7E3A8"/></g>';
// --- skyline layers (domes, minarets, palms) ---
const dome=(x,base,w,h,c)=>`<path d="M${x-w/2},${base} V${base-h*.45} Q${x-w/2},${base-h} ${x},${base-h*1.05} Q${x+w/2},${base-h} ${x+w/2},${base-h*.45} V${base} Z" fill="${c}"/><path d="M${x},${base-h*1.05} V${base-h*1.25}" stroke="${c}" stroke-width="6"/><circle cx="${x}" cy="${base-h*1.3}" r="7" fill="${c}"/>`;
const minaret=(x,base,h,c)=>`<path d="M${x-14},${base} V${base-h} H${x+14} V${base} Z M${x-22},${base-h*.72} H${x+22} V${base-h*.68} H${x-22} Z M${x-20},${base-h} Q${x},${base-h-60} ${x+20},${base-h} Z" fill="${c}"/><path d="M${x},${base-h-58} V${base-h-80}" stroke="${c}" stroke-width="5"/>`;
const palm=(x,base,h,c)=>`<path d="M${x},${base} Q${x+8},${base-h/2} ${x-4},${base-h}" stroke="${c}" stroke-width="12" fill="none"/>`+[...Array(7)].map((_,i)=>{const a=-160+i*25;const rx=Math.cos(a*Math.PI/180)*110,ry=Math.sin(a*Math.PI/180)*60;return `<path d="M${x-4},${base-h} Q${x-4+rx*.5},${base-h+ry*.2-40} ${x-4+rx},${base-h+ry+30}" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/>`}).join('');
const layer=(base,c,items,hill)=>`<path d="M0,1440 V${base} ${hill} V1440 Z" fill="${c}"/>`+items;
out+=layer(1230,'#3b2f3f',dome(300,1230,260,190,'#3b2f3f')+minaret(120,1230,330,'#3b2f3f')+minaret(480,1230,300,'#3b2f3f')+dome(2260,1230,300,210,'#3b2f3f')+minaret(2050,1230,360,'#3b2f3f')+minaret(2470,1230,320,'#3b2f3f')+palm(760,1230,240,'#3b2f3f')+palm(1800,1230,260,'#3b2f3f'),'Q640,1200 1280,1215 T2560,1225');
out+=layer(1310,'#231b2a',dome(620,1310,200,150,'#231b2a')+dome(1980,1310,220,160,'#231b2a')+minaret(820,1310,260,'#231b2a')+minaret(1760,1310,270,'#231b2a')+palm(240,1310,280,'#231b2a')+palm(2350,1310,300,'#231b2a')+palm(1120,1310,200,'#231b2a')+palm(1460,1310,210,'#231b2a'),'Q900,1280 1500,1300 T2560,1295');
out+=layer(1390,'#120d17','', 'Q700,1370 1280,1385 T2560,1380');
// tiny glowing windows
for(let i=0;i<40;i++){const x=rnd()*2560,y=1250+rnd()*110;out+=`<rect x="${x}" y="${y}" width="6" height="10" rx="2" fill="#FFD27A" opacity="${.5+rnd()*.5}"/>`}
document.getElementById('s').innerHTML=out;
</script></body></html>
