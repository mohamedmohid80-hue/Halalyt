<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;position:relative;overflow:hidden;background:#d9dde0}
.board{position:absolute;left:-20px;top:-20px;right:-20px;bottom:-20px;background:linear-gradient(115deg,#fbfcfc 0%,#f2f4f5 40%,#fdfefe 52%,#eef1f2 100%)}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 46%,transparent 54%)}
svg{position:absolute;inset:0}
.mk{font-family:'Permanent Marker'}
.hw{font-family:Caveat;font-weight:700}
</style></head><body>
<div class="board"></div>
<div class="sheen"></div>
<svg width="2560" height="1440" viewBox="0 0 2560 1440" id="s"></svg>
<script>
const rough=(d,c,w=7,o=1)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"/>`;
let o=`<defs>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
 <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity=".22"/></filter>
</defs>`;
// ghost eraser smudges from old lessons
o+=`<g filter="url(#blur)" opacity=".16" fill="none" stroke="#5a6470" stroke-width="22" stroke-linecap="round">
 <path d="M180,1120 q160,-60 320,0 t320,0"/><path d="M1650,180 q200,40 420,-10"/><path d="M2100,1180 q120,-90 300,-20"/><path d="M820,1250 q300,40 560,-20"/></g>`;
o+=`<g filter="url(#ink)">`;
// ---------- top-left: the prayer-time bar lesson ----------
o+=`<text x="120" y="150" class="hw" font-size="64" fill="#1E5FBF">Dhuhr → Asr</text>`;
o+=rough('M120,200 H760','#151515',6);
o+=`<rect x="120" y="225" width="300" height="70" rx="12" fill="#1FA34A" opacity=".85"/><rect x="430" y="225" width="330" height="70" rx="12" fill="#F2B705" opacity=".85"/>`;
o+=`<text x="270" y="275" text-anchor="middle" class="mk" font-size="40" fill="#fff">DHUHR</text><text x="595" y="275" text-anchor="middle" class="mk" font-size="40" fill="#fff">ASR</text>`;
o+=rough('M420,190 V330','#E31B1B',7)+`<text x="440" y="370" class="hw" font-size="50" fill="#E31B1B">it's a window, not a deadline!</text>`;
// ---------- top-right: maths of good deeds ----------
o+=`<text x="1700" y="160" class="mk" font-size="74" fill="#151515">100 × <tspan fill="#1E7B4F">SubhanAllah</tspan></text>`;
o+=rough('M1730,190 C1900,230 2050,230 2200,195','#151515',6);
o+=`<text x="1880" y="300" class="mk" font-size="96" fill="#E8A92E">= 1,000</text><text x="2290" y="300" class="hw" font-size="54" fill="#1FA34A">good deeds ✓</text>`;
o+=rough('M1860,320 Q2080,350 2290,318','#E8A92E',8);
// ---------- bottom-left: thumb in vs thumb out ----------
o+=`<text x="120" y="1080" class="hw" font-size="60" fill="#151515">thumb IN</text>`+rough('M120,1100 L380,1100','#151515',5);
o+=`<text x="430" y="1080" class="hw" font-size="60" fill="#151515">thumb OUT</text>`+rough('M430,1100 L720,1100','#151515',5);
o+=rough('M160,1160 L300,1300 M300,1160 L160,1300','#E31B1B',14)+rough('M470,1240 L540,1310 L690,1150','#1FA34A',14);
// ---------- bottom-right: timeline 1400 years ----------
o+=rough('M1780,1200 H2440','#151515',7)+rough('M2410,1180 L2445,1200 L2410,1220','#151515',7);
o+=`<circle cx="1820" cy="1200" r="14" fill="#151515"/><circle cx="2380" cy="1200" r="14" fill="#E31B1B"/>`;
o+=`<text x="1790" y="1270" class="hw" font-size="54" fill="#151515">610 CE</text><text x="2290" y="1270" class="hw" font-size="54" fill="#E31B1B">you, today</text>`;
o+=`<text x="1930" y="1160" class="mk" font-size="58" fill="#1E5FBF">1400 years</text>`;
// ---------- doodles ----------
o+=`<g transform="translate(1500 290) rotate(-8)">`+rough('M30,-50 A55,55 0 1 0 30,50 A42,42 0 1 1 30,-50 Z','#F2B705',8)+`</g>`;
o+=`<g transform="translate(1400 1230)">`+rough('M0,-40 L10,-12 L40,-12 L16,6 L25,36 L0,18 L-25,36 L-16,6 L-40,-12 L-10,-12 Z','#1E7B4F',7)+`</g>`;
o+=rough('M1180,1180 q30,-50 60,0 q30,50 60,0','#1E5FBF',6);
o+=`<text x="1040" y="1330" class="mk" font-size="120" fill="#E31B1B" transform="rotate(-10 1040 1330)">?</text>`;
o+=`<text x="2420" y="470" class="mk" font-size="120" fill="#1E5FBF" transform="rotate(12 2420 470)">!</text>`;
// ---------- the centre headline ----------
o+=`<text x="1280" y="680" text-anchor="middle" class="mk" font-size="132" fill="#151515">Good question.</text>`;
o+=`<rect x="760" y="720" width="1040" height="78" fill="#FFE14D" opacity=".75" transform="rotate(-1 1280 760)"/>`;
o+=`<text x="1280" y="784" text-anchor="middle" class="hw" font-size="76" fill="#151515">let's work it out on the board</text>`;
o+=rough('M700,580 C620,620 620,820 720,850','#E31B1B',8)+rough('M1860,580 C1940,620 1940,820 1840,850','#E31B1B',8);
o+=rough('M1860,880 C1930,940 1960,1010 1980,1090','#151515',6)+rough('M1955,1070 L1982,1095 L1998,1060','#151515',6);
o+=`</g>`;
// ---------- sticky notes ----------
const note=(x,y,r,c,t1,t2)=>`<g transform="translate(${x} ${y}) rotate(${r})" filter="url(#sh)"><rect x="-150" y="-150" width="300" height="300" fill="${c}"/><rect x="-150" y="-150" width="300" height="46" fill="#000" opacity=".05"/><text x="0" y="-10" text-anchor="middle" class="hw" font-size="58" fill="#222">${t1}</text><text x="0" y="60" text-anchor="middle" class="hw" font-size="58" fill="#222">${t2}</text></g>`;
o+=note(300,690,-6,'#FFE97A','is it','haram?')+note(2270,700,5,'#FFB3C7','why','27×?');
o+=note(1100,180,4,'#B8F0C6','what did','they eat?');
// magnets
o+=`<circle cx="300" cy="555" r="22" fill="#E31B1B" filter="url(#sh)"/><circle cx="2270" cy="565" r="22" fill="#1E5FBF" filter="url(#sh)"/><circle cx="1100" cy="45" r="22" fill="#F2B705" filter="url(#sh)"/>`;
// ---------- marker tray + markers + eraser ----------
o+=`<rect x="0" y="1395" width="2560" height="45" fill="#b9bfc4"/><rect x="0" y="1390" width="2560" height="10" fill="#e3e7ea"/>`;
const marker=(x,c,r)=>`<g transform="translate(${x} 1372) rotate(${r})" filter="url(#sh)"><rect x="-90" y="-16" width="150" height="32" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="2"/><rect x="60" y="-18" width="44" height="36" rx="8" fill="${c}"/><rect x="-108" y="-10" width="20" height="20" rx="4" fill="${c}"/></g>`;
o+=marker(700,'#151515',2)+marker(940,'#E31B1B',-3)+marker(1180,'#1E5FBF',1)+marker(1410,'#1FA34A',-2);
o+=`<g transform="translate(1800 1360)" filter="url(#sh)"><rect x="-120" y="-34" width="240" height="56" rx="10" fill="#2a2f35"/><rect x="-120" y="16" width="240" height="18" rx="4" fill="#d8c9a8"/></g>`;
document.getElementById('s').innerHTML=o;
</script></body></html>
