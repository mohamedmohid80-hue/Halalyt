<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;background:#FBF8F1;position:relative;overflow:hidden;font-family:Poppins}
.band{position:absolute;left:0;right:0;top:508px;height:424px;background:#1E7B4F}
.dots{position:absolute;inset:0;background-image:radial-gradient(#E9E2D3 3px,transparent 3px);background-size:46px 46px;opacity:.7}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:424px;display:flex;align-items:center;gap:40px;padding-left:90px}
.hadi{height:390px;margin-top:20px;transform:scaleX(-1);filter:drop-shadow(0 18px 22px rgba(0,0,0,.25))}
.name{font:900 112px Poppins;color:#fff;letter-spacing:-2px;line-height:1}
.name span{color:#F2C14E}
.tag{font:400 60px 'Patrick Hand';color:#E7F3EC;margin-top:18px}
.pill{display:inline-block;margin-top:26px;background:#F2C14E;color:#1B1B1B;font:800 34px Poppins;padding:10px 26px;border-radius:999px}
</style></head><body>
<div class="dots"></div>
<div class="band"></div>
<div class="safe">
  <img class="hadi" src="hadi.svg">
  <div>
    <div class="name">hadi<span>.</span>teachings</div>
    <div class="tag">Islam, explained simply.</div>
    <div class="pill">New videos every week</div>
  </div>
</div>
</body></html>
