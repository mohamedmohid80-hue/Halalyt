<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Patrick+Hand&family=Comic+Neue:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;position:relative;overflow:hidden;background:#FFF4DC}
.sun{position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 50%,#FFE8B0 0 7.5deg,#FFF4DC 7.5deg 15deg);opacity:.9;-webkit-mask:radial-gradient(circle at 50% 50%,#000 0,#000 45%,transparent 75%)}
svg{position:absolute;inset:0}
.plate{position:absolute;left:830px;top:600px;width:900px;height:240px;background:#1E7B4F;border:12px solid #17201B;border-radius:40px;box-shadow:0 14px 0 #17201B;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-2deg)}
.name{font:900 98px Poppins;color:#fff;letter-spacing:-2px;line-height:1}
.name span{color:#F2C14E}
.tag{font:400 46px 'Patrick Hand';color:#E7F3EC;margin-top:8px}
</style></head><body>

<svg width="2560" height="1440" viewBox="0 0 2560 1440" id="s"></svg>
<div class="plate"><div class="name">hadi<span>.</span>teachings</div><div class="tag">Islam, explained simply.</div></div>
<script>
const INK='#17201B',SKIN='#D9A57B',GREEN='#1E7B4F';
let seed=5;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
// ---- doodles in the background ----
const doodle={
 moon:(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M10,-30 A32,32 0 1 0 10,30 A24,24 0 1 1 10,-30 Z" fill="#F2C14E" stroke="${INK}" stroke-width="5"/></g>`,
 star:(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0,-26 L7,-8 L26,-8 L11,4 L16,23 L0,12 L-16,23 L-11,4 L-26,-8 L-7,-8 Z" fill="#F2C14E" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></g>`,
 lantern:(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0,-50 V-38" stroke="${INK}" stroke-width="5"/><path d="M-16,-38 H16 L22,-26 H-22 Z" fill="${GREEN}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M-20,-26 Q-28,0 -18,26 H18 Q28,0 20,-26 Z" fill="#FFD36B" stroke="${INK}" stroke-width="5"/><path d="M-18,26 H18 L12,36 H-12 Z" fill="${GREEN}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></g>`,
 book:(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0,-18 Q-22,-30 -44,-22 V24 Q-22,16 0,28 Q22,16 44,24 V-22 Q22,-30 0,-18 Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M0,-18 V28" stroke="${INK}" stroke-width="5"/><path d="M-34,-8 H-10 M-34,4 H-10 M10,-8 H34 M10,4 H34" stroke="#9AA0A6" stroke-width="4" stroke-linecap="round"/></g>`,
 spark:(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0,-20 Q3,-3 20,0 Q3,3 0,20 Q-3,3 -20,0 Q-3,-3 0,-20 Z" fill="#fff" stroke="${INK}" stroke-width="4"/></g>`,
};
const kinds=Object.keys(doodle);let bg='';
for(let i=0;i<70;i++){const x=rnd()*2560,y=rnd()*1440;if(x>480&&x<2080&&y>500&&y<940)continue;bg+=doodle[kinds[i%kinds.length]](x,y,0.7+rnd()*0.6,(rnd()-.5)*50)}
// ---- cartoon Hadi head (no hood): face, kufi, a bit of green collar ----
const EX={
 grin:`<path d="M-30,-2 Q-20,-14 -10,-2" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M10,-2 Q20,-14 30,-2" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M-26,22 Q0,56 26,22 Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`,
 shock:`<circle cx="-20" cy="0" r="13" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="-20" cy="2" r="6" fill="${INK}"/><circle cx="20" cy="0" r="13" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="20" cy="2" r="6" fill="${INK}"/><ellipse cx="0" cy="36" rx="11" ry="14" fill="#7A2B2B" stroke="${INK}" stroke-width="5"/>`,
 wink:`<circle cx="-20" cy="0" r="7" fill="${INK}"/><path d="M10,0 Q20,-10 30,0" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M-18,28 Q4,44 22,24" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`,
 laugh:`<path d="M-30,0 Q-20,-12 -10,0" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M10,0 Q20,-12 30,0" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M-28,18 Q0,64 28,18 Z" fill="#7A2B2B" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M-14,42 Q0,52 14,42" fill="#E86A6A"/>`,
 think:`<circle cx="-20" cy="2" r="7" fill="${INK}"/><circle cx="20" cy="2" r="7" fill="${INK}"/><path d="M8,-18 Q20,-26 32,-16" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M-14,34 Q4,30 16,34" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`,
 star:`<path d="M-20,-14 L-16,-4 L-6,-4 L-14,2 L-11,12 L-20,6 L-29,12 L-26,2 L-34,-4 L-24,-4 Z" fill="#F2C14E" stroke="${INK}" stroke-width="3"/><path d="M20,-14 L24,-4 L34,-4 L26,2 L29,12 L20,6 L11,12 L14,2 L6,-4 L16,-4 Z" fill="#F2C14E" stroke="${INK}" stroke-width="3"/><path d="M-24,22 Q0,52 24,22 Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`,
 calm:`<path d="M-30,0 Q-20,8 -10,0" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M10,0 Q20,8 30,0" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><path d="M-16,28 Q0,40 16,28" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`,
};
const head=(x,y,s,r,ex,blush=true)=>{
 const dots=[...Array(9)].map((_,i)=>`<circle cx="${-56+i*14}" cy="${i%2?-42:-54}" r="4" fill="${GREEN}"/>`).join('');
 return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">
  <path d="M-70,92 Q-60,60 0,58 Q60,60 70,92 Z" fill="${GREEN}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="0" cy="8" r="72" fill="${SKIN}" stroke="${INK}" stroke-width="7"/>
  ${blush?`<ellipse cx="-44" cy="26" rx="11" ry="7" fill="#E88A7A" opacity=".75"/><ellipse cx="44" cy="26" rx="11" ry="7" fill="#E88A7A" opacity=".75"/>`:''}
  <g transform="translate(0 12)">${EX[ex]}</g>
  <path d="M-71,-12 C-69,-86 69,-86 71,-12 C42,-26 -42,-26 -71,-12 Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>${dots}
 </g>`;};
const bubble=(x,y,t,w,flip=false)=>`<g transform="translate(${x} ${y})"><rect x="${-w/2}" y="-46" width="${w}" height="92" rx="40" fill="#fff" stroke="${INK}" stroke-width="7"/><path d="M${flip?20:-20},44 L${flip?50:-50},84 L${flip?-6:6},44 Z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><rect x="${-w/2+8}" y="30" width="${w-16}" height="12" fill="#fff"/><text x="0" y="16" text-anchor="middle" font-family="Comic Neue" font-style="italic" font-weight="700" font-size="44" fill="${INK}">${t}</text></g>`;
// big heads around the plate, popping in from every side at different sizes
const H=[
 [650,720,1.85,-10,'grin'],[1910,710,1.85,10,'laugh'],
 [210,300,1.5,-18,'wink'],[230,1170,1.7,14,'shock'],[2350,290,1.5,16,'star'],[2330,1180,1.7,-12,'think'],
 [880,240,1.25,-6,'calm'],[1280,190,1.35,4,'shock'],[1680,250,1.25,8,'wink'],
 [900,1200,1.3,8,'star'],[1300,1250,1.4,-4,'grin'],[1700,1200,1.3,-8,'laugh'],
 [40,700,1.2,20,'calm'],[2520,720,1.2,-20,'grin'],
];
let heads=H.map(h=>head(...h)).join('');
const bubbles=bubble(720,430,'Assalamu alaikum!',470)+bubble(1850,420,'SubhanAllah!',360,true);
document.getElementById('s').innerHTML=bg+heads+bubbles;
</script></body></html>
