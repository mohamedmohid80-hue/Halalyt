<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hook Frame Board v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Poppins:wght@900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E6E6E6;font-family:Nunito,sans-serif;color:#151515;padding:28px}
  h1{font:900 40px Poppins;margin-bottom:4px}
  .sub{font:700 16px Nunito;opacity:.7;margin-bottom:22px;max-width:1900px}
  .grid{display:grid;grid-template-columns:repeat(4,480px);gap:20px}
  .panel{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08)}
  .frame{width:480px;height:270px;position:relative;overflow:hidden;background:#fff;border-bottom:1px solid #eee}
  .scene{width:1920px;height:1080px;transform:scale(.25);transform-origin:0 0;position:absolute;top:0;left:0;background:#fff}
  .meta{padding:10px 14px 14px;font-size:14px;line-height:1.35}
  .t{font:900 18px Poppins;color:#C0392B}
  .vo{font-weight:900;margin:3px 0 6px}
  .row{display:flex;gap:6px;margin-top:2px}
  .k{font-weight:900;min-width:58px;opacity:.5;font-size:12px;text-transform:uppercase;padding-top:1px}
  .img{position:absolute}
  .photo{box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .sticker{position:absolute;font-family:Poppins;font-weight:900;-webkit-text-stroke:14px #111;paint-order:stroke fill;text-shadow:0 10px 18px rgba(0,0,0,.35);white-space:nowrap;letter-spacing:-1px}
  .line{position:absolute;left:0;width:1920px;text-align:center;font:700 64px "Comic Neue";color:#111}
  .cap{position:absolute;font-family:Poppins;font-weight:900;color:#fff;-webkit-text-stroke:12px #111;paint-order:stroke fill;white-space:nowrap}
  .ph{position:absolute;border:8px dashed #999;border-radius:12px;background:#F4F4F4;display:flex;align-items:center;justify-content:center;text-align:center;font:900 60px Nunito;color:#777;line-height:1.2}
  .hl{position:absolute;background:rgba(255,214,0,.45);border-radius:6px}
  .wipe{position:absolute;background:#F03A2E}
  .arrow{position:absolute;font:900 120px Nunito;color:#111;opacity:.18}
</style>
</head>
<body>
<h1>Hook · Frame Board v2</h1>
<div class="sub">"What Makes a YouTube Video Haram?" · 0:00–0:33 · 22 beats · white background, a real image every 0.5–1.5 s, simple keyframes (slide-in with ease-out, slow zoom, cut-ins, quick pops). Times are taken word by word from your voiceover.</div>
<div class="grid" id="grid"></div>
<script>
const A = 'assets/';
const img = (src, x, y, w, o = {}) => `<img class="img ${o.photo ? 'photo' : ''}" src="${A}${src}" style="left:${x}px;top:${y}px;width:${w}px;${o.rot ? `transform:rotate(${o.rot}deg);` : ''}${o.border ? 'border:6px solid #111;' : ''}">`;
const hadi = (pose, x, h = 860) => `<img class="img" src="../../brand/hadi/hadi-${pose}.svg" style="left:${x}px;bottom:40px;height:${h}px">`;
const sticker = (txt, color, x, y, size = 150, rot = 0) => `<div class="sticker" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};transform:rotate(${rot}deg)">${txt}</div>`;
const line = (txt, y = 500) => `<div class="line" style="top:${y}px">${txt}</div>`;
const cap = (txt, x, y, size = 90) => `<div class="cap" style="left:${x}px;top:${y}px;font-size:${size}px">${txt}</div>`;
const ph = (txt, x, y, w, h) => `<div class="ph" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${txt}</div>`;
const center = (src, w, top, o) => img(src, (1920 - w) / 2, top, w, o);

const F = [
  { t:'0:00.0', vo:'Be honest.', s: hadi('phone', 760),
    vis:'Hadi (narrator) on his phone, centred.', mot:'Slides in from the right edge in 0.25 s, ease-out, no bounce. Then slow zoom.', src:'Hadi' },
  { t:'0:00.6', vo:'When was the last time…', s: center('emoji-alarm.png', 560, 240),
    vis:'3D alarm clock emoji.', mot:'Slide-in from right (0.25 s), slow zoom 100→104%.', src:'Fluent 3D emoji (MIT)' },
  { t:'0:02.4', vo:'…you uploaded a video…', s: center('yt-upload.png', 1100, 60, {photo:true}) + `<img class="img" src="assets/cursor.svg" style="left:975px;top:640px;width:70px">`,
    vis:'Your real YouTube Studio "Upload videos" screenshot. A cursor moves to "Select files" and clicks.', mot:'Slide-in, slow zoom toward the button; cursor click on "video" (3.0 s).', src:'Your screenshot' },
  { t:'0:03.9', vo:'…and actually STOPPED…', s: center('emoji-stop.png', 560, 240),
    vis:'3D stop sign: the literal word.', mot:'Hard cut-in on "stopped".', src:'Fluent 3D emoji' },
  { t:'0:04.8', vo:'…to ask, is this HALAL?', s: img('emoji-thinking.png', 330, 300, 480) + sticker('HALAL?', '#2ECC40', 900, 400, 210, -3),
    vis:'Thinking emoji left, keyword sticker "HALAL?" right in green.', mot:'Emoji cut-in, sticker quick pop (3 frames) on "halal" (5.9 s).', src:'Fluent 3D emoji' },
  { t:'0:06.4', vo:'Most of us check the TITLE…', s: center('yt-title.png', 1500, 480) + `<div class="hl" style="left:205px;top:500px;width:1505px;height:95px;mix-blend-mode:multiply"></div>` + sticker('TITLE', '#FFD400', 760, 180, 170, -2),
    vis:'Punch-in on a real YouTube video title. Yellow highlighter sweeps under it, sticker "TITLE".', mot:'Slide-in, highlighter sweeps on "title" (7.9 s).', src:'Real YouTube screenshot' },
  { t:'0:08.8', vo:'…the THUMBNAIL…', s: center('yt-thumb0.png', 1180, 190, {photo:true}) + sticker('THUMBNAIL', '#FFD400', 520, 40, 140, -2),
    vis:'Punch-in on the thumbnail.', mot:'Instant punch-in (scale jump) on "thumbnail".', src:'Real YouTube screenshot' },
  { t:'0:09.8', vo:'…the VIEWS.', s: center('yt-views.png', 1100, 380) + img('emoji-eyes.png', 1450, 640, 300),
    vis:'Punch-in on the real "views · years ago" line. Eyes emoji pops beside it.', mot:'Punch-in + emoji quick pop.', src:'Real YouTube screenshot + Fluent emoji' },
  { t:'0:10.6', vo:'But what if I told you…', s: center('meme-rollsafe.jpg', 1100, 190, {photo:true}),
    vis:'"Roll Safe" think-about-it meme (the tapping-head guy).', mot:'Slide-in, slow zoom.', src:'Meme (imgflip template)' },
  { t:'0:12.6', vo:'…the most common things creators do on YouTube…', s: img('yt-thumb1.png', 160, 300, 620, {photo:true, rot:-3}) + img('yt-thumb2.png', 650, 260, 620, {photo:true, rot:2}) + img('yt-thumb3.png', 1140, 320, 620, {photo:true, rot:-1}) + center('yt-logo.png', 520, 40),
    vis:'Three real thumbnails cascade in; the YouTube logo cuts in on "YouTube" (14.2 s).', mot:'Each slides in from the right, 0.4 s apart.', src:'Real YouTube screenshots' },
  { t:'0:15.6', vo:'…are actually HARAM…', s: img('yt-thumb1.png', 160, 300, 620, {photo:true, rot:-3}) + img('yt-thumb2.png', 650, 260, 620, {photo:true, rot:2}) + img('yt-thumb3.png', 1140, 320, 620, {photo:true, rot:-1}) + sticker('HARAM', '#F03A2E', 560, 330, 300, -4),
    vis:'Big red keyword "HARAM" over the thumbnails.', mot:'Stamp: 400% → 100% in 0.3 s, then slow zoom.', src:'—' },
  { t:'0:16.7', vo:'…and most people doing them…', s: center('emoji-crowd.png', 620, 220),
    vis:'3D "people" emoji.', mot:'Slide-in.', src:'Fluent 3D emoji' },
  { t:'0:18.0', vo:'…have NO IDEA.', s: img('emoji-shrug.png', 300, 200, 640) + sticker('NO IDEA', '#FFD400', 980, 420, 190, -3),
    vis:'Shrug emoji + sticker "NO IDEA".', mot:'Cut-in, sticker quick pop on "idea".', src:'Fluent 3D emoji' },
  { t:'0:19.5', vo:'Now, I know what you\'re thinking…', s: `<div class="wipe" style="left:1250px;top:0;width:670px;height:1080px"></div>` + hadi('think', 560),
    vis:'Red wipe sweeps across, revealing Hadi in the thinking pose.', mot:'Red rectangle wipe 0.35 s right→left.', src:'Hadi' },
  { t:'0:21.5', vo:'It\'s just YouTube, right?', s: center('yt-logo.png', 420, 330) + line('"it\'s just YouTube, right?"', 620),
    vis:'Plain line in the casual font under a small YouTube logo.', mot:'Text appears word by word with the voice.', src:'Real logo' },
  { t:'0:23.1', vo:'It\'s just content.', s: line('"it\'s just content."', 500),
    vis:'Plain line alone on white.', mot:'Cut-in.', src:'—' },
  { t:'0:23.8', vo:'Well…', s: center('meme-monkey.jpg', 820, 200, {photo:true}) + cap('well...', 820, 80, 110),
    vis:'Side-eye monkey puppet meme with a meme caption "well...".', mot:'Slide-in, caption cut-in.', src:'Meme (imgflip template)' },
  { t:'0:24.6', vo:'…not exactly.', s: hadi('facepalm', 260) + sticker('NOT EXACTLY', '#F03A2E', 780, 440, 150, -3),
    vis:'Hadi facepalm + red sticker "NOT EXACTLY".', mot:'Hadi cut-in, sticker quick pop on "exactly" (25.3 s).', src:'Hadi' },
  { t:'0:25.9', vo:'Every video you upload…', s: center('yt-thumb0.png', 1000, 230, {photo:true}),
    vis:'One real video thumbnail, centred.', mot:'Slide-in, slow zoom starts.', src:'Real YouTube screenshot' },
  { t:'0:27.9', vo:'…can be watched thousands of times.', s: center('yt-thumb0.png', 1000, 160, {photo:true}) + sticker('12,483 views', '#FFD400', 520, 770, 140, -2) + img('emoji-eyes.png', 1560, 240, 240),
    vis:'View counter sticker under the thumbnail, rolling up. Eyes emoji.', mot:'Counter rolls up to "times" (29.1 s). Slow zoom continues.', src:'Fluent emoji' },
  { t:'0:29.5', vo:'And every one of those views…', s: sticker('EVERY.', '#FFFFFF', 130, 430, 160, -2) + sticker('SINGLE.', '#FFFFFF', 740, 430, 160, -2) + sticker('VIEW.', '#FFD400', 1440, 430, 160, -2),
    vis:'Three words cut in one by one: EVERY. SINGLE. VIEW.', mot:'Cut-in per word (30.0 / 30.4 / 30.9 s).', src:'—' },
  { t:'0:31.3', vo:'…counts for something.', s: center('emoji-scale.png', 600, 220),
    vis:'3D balance scale emoji: deeds being weighed.', mot:'Slide-in, slow zoom, 0.4 s of silence, then cut to Point 1.', src:'Fluent 3D emoji' },
];
document.getElementById('grid').innerHTML = F.map((f, i) => `
  <div class="panel"><div class="frame"><div class="scene">${f.s}</div></div>
  <div class="meta"><div class="t">${i + 1} · ${f.t}</div><div class="vo">“${f.vo}”</div>
  <div class="row"><div class="k">Visual</div><div>${f.vis}</div></div>
  <div class="row"><div class="k">Motion</div><div>${f.mot}</div></div>
  <div class="row"><div class="k">Source</div><div>${f.src}</div></div></div></div>`).join('');
</script>
</body>
</html>
